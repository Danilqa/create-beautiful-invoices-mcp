name: CI

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  format:
    name: 🎨 Format
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
      - name: Set up the workspace
        uses: ./.github/actions/setup
      - name: Check the formatting with Prettier
        run: pnpm format:check

  lint:
    name: 🧹 Lint
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
      - name: Set up the workspace
        uses: ./.github/actions/setup
      - name: Lint with ESLint
        run: pnpm lint

  typecheck:
    name: 🔷 Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
      - name: Set up the workspace
        uses: ./.github/actions/setup
      - name: Typecheck every package
        run: pnpm typecheck

  unit-tests:
    name: 🧪 Unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
      - name: Set up the workspace
        uses: ./.github/actions/setup
      - name: Run the unit tests of every package
        run: pnpm test

  npm-package:
    name: 📦 npm package
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7
      - name: Set up the workspace
        uses: ./.github/actions/setup
      - name: Build and pack the server
        run: |
          tarball="$RUNNER_TEMP/create-beautiful-invoices-mcp.tgz"
          pnpm --filter create-beautiful-invoices-mcp pack --out "$tarball"
          echo "TARBALL=$tarball" >> "$GITHUB_ENV"
      - name: Check that the package ships bin, dist, README and LICENSE but not src
        run: |
          contents="$(tar -tzf "$TARBALL")"
          for file in bin/create-beautiful-invoices-mcp.js dist/main.js README.md LICENSE; do
            grep -qxF "package/$file" <<< "$contents" || { echo "$file is not packed"; exit 1; }
          done
          if grep -q '^package/src/' <<< "$contents"; then echo 'src/ is packed'; exit 1; fi
      - name: Check that package.json has no devDependencies or workspace specifiers
        run: |
          tar -xzOf "$TARBALL" package/package.json | node -e '
            const manifest = JSON.parse(require("node:fs").readFileSync(0, "utf8"));
            if ("devDependencies" in manifest) throw new Error("devDependencies are packed");
            if (/"(workspace|catalog):/.test(JSON.stringify(manifest))) {
              throw new Error("workspace: or catalog: specifiers are packed");
            }
          '
      - name: Check that dist/main.js imports only node and the server dependencies
        run: |
          tar -xzOf "$TARBALL" package/dist/main.js | node -e '
            const code = require("node:fs").readFileSync(0, "utf8");
            const specifiers = [
              ...code.matchAll(/^(?:import|export)\s[^"]*"([^"]+)";$/gm),
              ...code.matchAll(/\b(?:import|require)\(\s*"([^"]+)"\s*\)/g),
            ].map(([, specifier]) => specifier);
            const unexpected = specifiers.filter(
              specifier =>
                !/^(node:|(@modelcontextprotocol\/server|@react-pdf\/renderer|react|ts-pattern|zod)(\/|$))/.test(
                  specifier,
                ),
            );
            if (unexpected.length > 0) {
              throw new Error(`dist/main.js imports ${[...new Set(unexpected)].join(", ")}`);
            }
          '
      - name: Install the package in an empty project
        run: |
          project="$RUNNER_TEMP/project"
          mkdir -p "$project"
          cd "$project"
          npm init -y > /dev/null
          npm install --no-audit --no-fund --loglevel=error "$TARBALL"
      - name: Create an invoice with the installed server through the MCP Inspector
        run: |
          invoices="$RUNNER_TEMP/invoices"
          pnpm exec mcp-inspector --cli -e INVOICES_DIR="$invoices" \
            node "$RUNNER_TEMP/project/node_modules/create-beautiful-invoices-mcp/bin/create-beautiful-invoices-mcp.js" \
            --method tools/call --tool-name create_invoice \
            --tool-arg invoiceNumber=INV-001 issueDate=2026-11-21 dueDate=2026-12-21 currency=EUR vatRate=20 \
            --tool-arg 'seller={"name":"Northwind Studio"}' 'client={"name":"Fabrikam"}' \
            --tool-arg 'items=[{"description":"Design","quantity":2,"unitPrice":500}]' \
            --tool-arg 'payment={"method":"iban-transfer","accountName":"Northwind Studio","iban":"DE89 3704 0044 0532 0130 00"}' \
            > result.json
          cat result.json
          grep -qF '"total": "€1,200.00"' result.json
          head -c 5 "$invoices/invoice-INV-001.pdf" | grep -qxF '%PDF-'
